services:
  dingfengbo-sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # deploy.ps1 会探测可用镜像源后传进来（缺省用官方 PyPI）
        PIP_INDEX: ${DINGFENGBO_PIP_INDEX:-https://pypi.org/simple}
    # tag 由 deploy.ps1 按 app/__init__.py 的 __version__ 传入，避免镜像名与版本脱节
    image: ${DINGFENGBO_SYNC_IMAGE:-dingfengbo-sync:dev}
    container_name: dingfengbo-sync
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 容器内以 uid 10001 运行，宿主目录需可写：chown -R 10001:10001 <数据目录>
      - ../data:/data
    environment:
      DINGFENGBO_HOST: 0.0.0.0
      DINGFENGBO_PORT: 8000
      DINGFENGBO_SERVER_DB: /data/cloud.db
      # 令牌白名单。留空时服务端仍接受任意令牌（仅限本机调试）。
      # deploy.ps1 会把本机设置里的同步令牌写进项目目录的 .env，不进镜像。
      DINGFENGBO_SYNC_TOKEN: ${DINGFENGBO_SYNC_TOKEN:-}
    # 日志轮转：避免容器 json-file 日志无限增长
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选 TLS 反代：docker compose --profile tls up -d
  # 域名解析到本机后由 Caddy 自动申请/续期证书。
  # 收口顺序（先验证再关闭，避免把自己锁在门外）：
  #   1) 启动 tls profile，用 https://<域名>/api/health 验证证书与反代；
  #   2) 桌面端「设置」改成 https 地址并测试连接；
  #   3) 确认可用后再删除上面 8000 的端口映射（或从云安全组移除 8000）。
  caddy:
    image: caddy:2-alpine
    container_name: dingfengbo-caddy
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - dingfengbo-sync
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
